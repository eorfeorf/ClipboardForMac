name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Package universal app
        run: ./scripts/package-release.sh
      - name: Verify both Mac architectures and signature
        run: |
          lipo dist/ClipboardForMac.app/Contents/MacOS/ClipboardForMac -verify_arch arm64 x86_64
          codesign --verify --deep --strict dist/ClipboardForMac.app
          cd dist
          shasum -a 256 -c ClipboardForMac-*.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ClipboardForMac-macOS-universal
          path: |
            dist/ClipboardForMac-*.zip
            dist/ClipboardForMac-*.zip.sha256
